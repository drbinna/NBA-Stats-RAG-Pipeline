services:
  # Backend API
  - type: web
    name: nba-stats-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.server:app --host 0.0.0.0 --port 8000
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BALLDONTLIE_API_KEY
        sync: false
      - key: DB_DSN
        sync: false
      - key: PORT
        value: 8000

  # Frontend Static Site
  # Frontend Static Site (Serving with Node/serve)
  - type: web
    name: nba-stats-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run serve:prod
    envVars:
      - key: PORT
        value: 4200
