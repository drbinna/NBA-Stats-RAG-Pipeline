services:
  - type: web
    name: courtside-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BALLDONTLIE_API_KEY
        sync: false
      - key: DB_DSN
        sync: false
